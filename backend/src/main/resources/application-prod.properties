# Nura Production Environment Configuration Profile

# Database Connection Settings
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nura}
spring.datasource.username=${DB_USER:nura}
spring.datasource.password=${DB_PASSWORD:nura}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate validation bounds
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Database migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Security: CORS and secure cookies settings
nura.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Logging: Prevent sensitive details leak to system files
logging.level.root=WARN
logging.level.org.springframework.web=INFO
logging.level.com.nura=INFO
logging.level.org.hibernate.SQL=WARN

# Multipart limits
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Actuator Health Probes configuration
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info

