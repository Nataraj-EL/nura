spring.application.name=nura-backend

# Server Configuration
server.port=8080

# Database Configuration with Environment variables (default to local postgres)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nura}
spring.datasource.username=${DB_USER:nura}
spring.datasource.password=${DB_PASSWORD:nura}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Database Migrations (Flyway)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Spring Boot Actuator Web health endpoint for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Active Profiles (default to dev)
spring.profiles.active=dev

# OTP Default Configuration
nura.otp.expiry-minutes=5
nura.otp.cooldown-seconds=60

# Disable mail health indicator to prevent downstream checks failure
management.health.mail.enabled=false

# Secure cookies setting
nura.cookie.secure=false



