# Override database configuration for production tests to use PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/nura
spring.datasource.username=nura
spring.datasource.password=nura
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# SMTP configuration for production tests (mocked or non-blocking)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=
