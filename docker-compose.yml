services:
  db:
    image: postgres:15-alpine
    container_name: nura-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nura
      POSTGRES_USER: nura
      POSTGRES_PASSWORD: nura
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
