version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nura-db
    environment:
      POSTGRES_DB: nura
      POSTGRES_USER: nura
      POSTGRES_PASSWORD: nura
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nura -d nura"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nura-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nura
      DB_USER: nura
      DB_PASSWORD: nura
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
